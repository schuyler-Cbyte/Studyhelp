<script>
'use strict';
// CHEM 152 Exam 2 Review, Chapter 4 (sheet "box structure" a Na, b Cu2+). Plan: books/chem152-exam2/chapters.md.
// Box rules (Aufbau, Pauli, Hund) are from the course slides; the ion step for Cu2+ is standard and labelled.
const CHAPTER = { number: 4, title: 'Electron Box Diagrams: Na and Cu²⁺', minutes: 5, language: 'en', next: '../ch05/' };

/* ---------- chapter data ---------- */
const WIDE = { x: 160, y: 300, w: 1280, cls: 'side', maxH: 560 };
const SRC_ION = 'Ion rule: standard method · not yet confirmed by course slides';
// Sodium, 11 electrons: [label, boxes, electrons, box top y, narration mark], lowest energy at the bottom.
const NA = [['1s', 1, 2, 640, 's1'], ['2s', 1, 2, 540, 's2'], ['2p', 3, 6, 440, 'p2'], ['3s', 1, 1, 340, 's3']];

/* ---------- helpers ---------- */
// Fill a row's boxes with k electrons: one up in each box first, then the downs (Hund), from t0, dt apart. Returns the end time.
function fillRow(p, row, k, t0, dt = .3) {
  const n = row._boxes.length, ups = Math.min(k, n), downs = k - ups;
  let t = t0;
  for (let i = 0; i < ups; i++) { const a = oArrow(p, row._boxes[i], 'u', { single: i >= downs }); show(a, t, .3); t += dt; }
  for (let i = 0; i < downs; i++) { const a = oArrow(p, row._boxes[i], 'd'); show(a, t, .3); t += dt; }
  return t;
}
const count = st => st.reduce((a, b) => a + b, 0);

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Boxes and arrows', (m) => {
    const p = panel(0);
    const g = G(p, { o: 0, y: 24 });
    T(g, 'Exam 2 review · box structures a and b', { x: 800, y: 290, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Electron Box Diagrams', { x: 800, y: 400, size: 88, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const ions = G(p, { o: 0 });
    cFormula(ions, [['Na', '']], 700, 490, { size: 56, fill: COL.nat, o: 1 });
    ionF(ions, [['Cu', '']], '2+', 900, 490, { size: 56, fill: COL.whole, o: 1 });
    show(ions, .7);
    const r = oRow(p, '', 3, 800 - 1.5 * OB, 570);
    show(r, m('sub'));
    fillRow(p, r, 4, m('sub', .6), .35);
  }],
  ['rules', 'The three rules', (m) => {
    const p = panel(0);
    const big = G(p, { x: 330, y: 400, s: 2.2 });
    const r = oRow(big, '', 1, -OB / 2, -OB / 2, { o: 0 });
    show(r, m('box'));
    show(oArrow(big, r._boxes[0], 'u'), m('box', .5), .3); show(oArrow(big, r._boxes[0], 'd'), m('pauli'), .3);
    show(cT(p, 'one box = one orbital', 330, 580, { size: 30, anchor: 'middle', weight: 600 }), m('box'));
    show(cT(p, 'Pauli: at most 2, opposite spins', 330, 630, { size: 28, fill: COL.task, anchor: 'middle' }), m('pauli'));
    const h3 = oRow(p, '', 3, 950, 368);
    show(h3, m('hund'));
    fillRow(p, h3, 4, m('hund', .5), .4);
    show(cT(p, "Hund: one in each box before pairing", 1046, 580, { size: 28, fill: COL.task, anchor: 'middle' }), m('hund', .3));
    show(cT(p, 'Aufbau: fill lowest energy first (bottom row first)', 800, 760, { size: 30, fill: COL.dim, anchor: 'middle' }), m('auf'));
  }],
  ['sodium', 'Sodium, 11 electrons', (m) => {
    const p = panel(0);
    show(cT(p, 'Na · 11 electrons', 1180, 230, { size: 36, weight: 600, anchor: 'middle' }), .3);
    const cfg = cTerms(p, NA.map(([lab, , k]) => [lab, String(k)]), 1180, 330, { size: 56 });
    NA.forEach(([lab, n, k, y, mark], i) => {
      const r = oRow(p, lab, n, 540, y, { size: 36 }), t = m(mark);
      show(r, i ? t : .4, .4);
      fillRow(p, r, k, t + .3, n === 3 ? .28 : .35);
      show(cfg[i], t + .3);
    });
    show(cT(p, '2 + 2 + 6 + 1 = 11', 1180, 440, { size: 40, font: CFONT, fill: COL.good, anchor: 'middle' }), m('count'));
    show(cT(p, 'one unpaired electron, in 3s', 1180, 510, { size: 30, fill: COL.task, anchor: 'middle', weight: 600 }), m('single'));
  }],
  ['q1', 'Quick check', () => {
    const p = panel(0);
    show(cT(p, 'Na · 1s² 2s² 2p⁶ 3s¹', 800, 220, { size: 44, font: CFONT, anchor: 'middle' }), .2);
  }, { ask: done => quiz(BAND, [{
    id: 'c-na3s', prompt: ["Draw sodium's 3s box."],
    build: boxBuild('3s', 1, st => st[0] === 1, [1], '3s¹: one electron, alone in the box (drawn as one up arrow).',
      st => st[0] === 2 ? 'That box shows 2 electrons; sodium’s 3s has only 1 (11 − 10).' : 'The box is empty. Sodium’s 11th electron goes in 3s.'),
  }], done) }],
  ['copper-ion', 'Cu²⁺: which electrons leave', (m) => {
    const p = panel(0);
    show(cT(p, 'Cu · 29 electrons', 800, 170, { size: 36, weight: 600, anchor: 'middle' }), .2);
    const a = cTerms(p, [['[Ar]', ''], ['4s', '2'], ['3d', '9']], 800, 280, { size: 68 });
    a.forEach((e, i) => show(e, m('cu', i * .4)));
    show(cT(p, 'Cu²⁺ loses 2 electrons: the highest shell (4s) goes first', 800, 400, { size: 32, fill: COL.bad, weight: 600, anchor: 'middle' }), m('ion'));
    tw(a[1], { o: .25 }, m('ion', 1), .4);
    draw(path(p, `M${a[1]._cx - a[1]._w / 2 - 8} 292L${a[1]._cx + a[1]._w / 2 + 8} 240`, { stroke: COL.bad, 'stroke-width': 5 }, { d: 0 }), m('ion', 1), .4);
    const b = cTerms(p, [['[Ar]', ''], ['3d', '9']], 800, 530, { size: 80, fill: COL.good });
    b.forEach((e, i) => show(e, m('res', i * .3)));
    show(cT(p, 'Measured Cu, [Ar] 4s¹ 3d¹⁰, gives the same ion.', 800, 630, { size: 28, fill: COL.dim, anchor: 'middle' }), m('same'));
    srcBadge(p, 740, m('same', .5), SRC_ION);
  }],
  ['copper-boxes', 'Cu²⁺ in boxes', (m) => {
    const p = panel(0);
    show(cFormula(p, [['Cu²⁺ = [Ar] 3d', '9']], 800, 160, { size: 56, sup: true }), .2);
    const ar = cBox(p, '[Ar]: 18 inner electrons', COL.faint, 330, 420, { size: 30, minW: 360 });
    show(ar, m('ar'));
    const s4 = oRow(p, '4s', 1, 690, 388, { size: 36 });
    show(s4, m('s4'));
    show(cT(p, 'empty', 690 + OB / 2, 500, { size: 24, fill: COL.dim, anchor: 'middle' }), m('s4', .3));
    const d3 = oRow(p, '3d', 5, 960, 388, { size: 36 });
    show(d3, m('d'));
    fillRow(p, d3, 9, m('d', .4), .32);
    show(cT(p, '4 pairs + 1 single = 9 electrons', 960 + 2.5 * OB, 520, { size: 30, font: CFONT, fill: COL.good, anchor: 'middle' }), m('count'));
    show(cT(p, '1 unpaired electron', 960 + 2.5 * OB, 580, { size: 30, fill: COL.task, weight: 600, anchor: 'middle' }), m('unp'));
  }],
  ['q2', 'Quick check', () => {
    const p = panel(0);
    show(cFormula(p, [['Cu²⁺ = [Ar] 3d', '9']], 800, 220, { size: 56, sup: true }), .2);
  }, { ask: done => quiz(BAND, [{
    id: 'c-unpaired', prompt: ['How many unpaired electrons does ', chemH(['Cu', '2+'], { sup: true }), ' have?'],
    build: chemBlanks([{ parts: [{ box: '1' }, { t: ' unpaired', ui: true }],
      why: 'Nine electrons in five boxes: one in each (5), then 4 pair up. That leaves 1 single.',
      hint: 'Put one electron in each of the five 3d boxes, then pair up the remaining four. How many are left alone?' }]),
  }], done) }],
  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    [['Write the configuration first (for an ion, add or remove electrons).', 'w1'], ['One box per orbital: s 1, p 3, d 5.', 'w2'],
      ['Singles first, then pairs with opposite spins.', 'w3']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 330 + i * 130, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 260, size: 34, weight: 600 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
    const r = oRow(p, '3d', 5, 800 - 2.5 * OB, 110, { size: 36 });
    show(r, .3); fillRow(p, r, 9, .6, .2);
    show(cT(p, 'Now try the chapter practice.', 800, 760, { size: 30, fill: COL.dim, anchor: 'middle' }), m('end'));
  }],
  ['final1', 'Chapter practice', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-fe3', prompt: [chemH(['Fe', '3+'], { sup: true }), ' is [Ar] 3d⁵. Draw its 3d boxes.'],
    build: boxBuild('3d', 5, st => st.every(x => x === 1), [1, 1, 1, 1, 1],
      'Five electrons, five boxes: one in each, none paired (Hund). Five unpaired electrons.',
      st => { const n = count(st); return n !== 5 ? `That shows ${n} electron${n === 1 ? '' : 's'}; 3d⁵ needs 5.` : 'Hund’s rule: fill every box with one electron before pairing any.'; }),
  }, {
    id: 'p-o2p', prompt: ['Oxygen is 1s² 2s² 2p⁴. Draw its 2p boxes.'],
    build: boxBuild('2p', 3, st => st.filter(x => x === 2).length === 1 && st.filter(x => x === 1).length === 2, [2, 1, 1],
      'Four electrons in three boxes: one in each, then the fourth pairs up. One pair, two singles.',
      st => { const n = count(st); return n !== 4 ? `That shows ${n} electron${n === 1 ? '' : 's'}; 2p⁴ needs 4.` : 'Hund’s rule: one in each box first, then only the fourth electron pairs.'; }),
  }], done, 'Chapter practice') }],
  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
