<body>
<script src="../lib/engine.js"></script>
<script src="../lib/chem.js"></script>
<script src="audio/en/timings.js"></script>
<script>
'use strict';
// CHEM 152 Exam 2 Review, Chapter 5 (sheet "Balance" a and b). Plan: books/chem152-exam2/chapters.md.
// Standard method, as in CHEM 152 Review chapter 8; labelled on screen. "C3H7" is balanced as written; propane is shown too.
const CHAPTER = { number: 5, title: 'Balancing the Two Equations', minutes: 6, language: 'en', next: '../ch06/' };

/* ---------- chapter data (all equations checked in chapters.md) ---------- */
const sp = (f, atoms) => ({ f, atoms });
const H2SO4 = sp([['H', '2'], ['S', ''], ['O', '4']], { H: 2, S: 1, O: 4 });
const BOH3 = sp([['B(OH)', '3']], { B: 1, O: 3, H: 3 });
const B2SO43 = sp([['B', '2'], ['(SO', '4'], [')', '3']], { B: 2, S: 3, O: 12 });
const H2O = sp([['H', '2'], ['O', '']], { H: 2, O: 1 }), O2 = sp([['O', '2']], { O: 2 }), CO2 = sp([['C', ''], ['O', '2']], { C: 1, O: 2 });
const C3H7 = sp([['C', '3'], ['H', '7']], { C: 3, H: 7 }), C3H8 = sp([['C', '3'], ['H', '8']], { C: 3, H: 8 });
const C4H10 = sp([['C', '4'], ['H', '10']], { C: 4, H: 10 });
const ALOH3 = sp([['Al(OH)', '3']], { Al: 1, O: 3, H: 3 }), AL2SO43 = sp([['Al', '2'], ['(SO', '4'], [')', '3']], { Al: 2, S: 3, O: 12 });
const TX = 630, WIDE = { x: 160, y: 300, w: 1280, cls: 'side', maxH: 560 };

/* ---------- helpers ---------- */
function setup(p, species, nLeft, els, y = 230, ty = 360, cw = 64) {
  const row = eqRow(p, species, nLeft, y, { size: 64, cw });
  show(row.g, .3);
  const tb = countTable(p, els, TX, ty);
  return { row, tb, species, nLeft };
}
const counts = (s, c, t0) => setCounts(s.tb, sideCount(s.species, c, 0, s.nLeft), sideCount(s.species, c, s.nLeft, s.species.length), t0);
const okText = (p, str, t0, y = 680) => show(cT(p, str, 800, y, { size: 38, font: CFONT, fill: COL.good, anchor: 'middle', weight: 600 }), t0);
function note(p, str, t0, y = 110) { const e = cT(p, str, 800, y, { size: 30, fill: COL.task, anchor: 'middle', weight: 600 }); show(e, t0); return e; }

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Atoms in, atoms out', (m) => {
    const p = panel(0);
    const g = G(p, { o: 0, y: 24 });
    T(g, 'Exam 2 review · balance a and b', { x: 800, y: 300, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Balancing Equations', { x: 800, y: 410, size: 88, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    show(cT(p, 'change only the coefficients until every atom matches', 800, 520, { size: 34, fill: COL.dim, anchor: 'middle' }), m('sub'));
    srcBadge(p, 640, m('note'));
  }],
  ['start', 'Start with the biggest formula', (m) => {
    const p = S.pa = panel(0);
    const s = S.sa = setup(p, [H2SO4, BOH3, B2SO43, H2O], 2, ['B', 'S', 'H', 'O']);
    show(s.tb.g, m('table'));
    counts(s, [1, 1, 1, 1], m('table', .4));
    pulse(s.row.items[2].form, m('big'), 1.12);
    S.bigNote = note(p, 'start with B₂(SO₄)₃: it has the most atoms', m('big'), 140);
  }],
  ['q1', 'Quick check', () => {}, { ask: done => quiz(BAND, [{
    id: 'c-boh3', prompt: ['B₂(SO₄)₃ has 2 boron atoms. How many B(OH)₃ do you need on the left?'],
    build: chemBlanks([{ parts: [{ box: '2' }, { t: '  B(OH)₃', ui: true }], why: 'Each B(OH)₃ has one B, so 2 of them give the 2 B atoms.',
      hint: 'B(OH)₃ has just one boron atom. Match the 2 borons on the right.' }]),
  }], done) }],
  ['fix-a', 'Boron, sulfate, then water', (m) => {
    const s = S.sa, p = S.pa;
    setCoef(s.row, 1, 2, m('b')); counts(s, [1, 2, 1, 1], m('b', .5));
    setCoef(s.row, 0, 3, m('s')); counts(s, [3, 2, 1, 1], m('s', .5));
    hide(S.bigNote, m('b'), .3);
    note(p, 'SO₄ stays together: 3 sulfates on the right → 3 H₂SO₄', m('s', .3), 140);
    setCoef(s.row, 3, 6, m('h')); counts(s, [3, 2, 1, 6], m('h', .8));
    s.tb.vals.slice(6).forEach(v => pulse(v, m('o', .2), 1.4));
    okText(p, '3 H₂SO₄ + 2 B(OH)₃ → B₂(SO₄)₃ + 6 H₂O', m('done'));
  }],
  ['start-b', 'Equation b: carbon, then hydrogen', (m) => {
    const p = S.pb = panel(0);
    const s = S.sb = setup(p, [C3H7, O2, CO2, H2O], 2, ['C', 'H', 'O'], 230, 360, 130);
    show(s.tb.g, m('c'));
    counts(s, [1, 1, 1, 1], m('c', .3));
    setCoef(s.row, 2, 3, m('c', 1.2)); counts(s, [1, 1, 3, 1], m('c', 1.6));
    setCoef(s.row, 3, '7/2', m('h', .8)); counts(s, [1, 1, 3, 3.5], m('h', 1.3));
    S.hNote = note(p, '7 hydrogens ÷ 2 per water = 7/2 water (a fraction for now)', m('half'), 140);
  }],
  ['q2', 'Quick check', () => {}, { ask: done => quiz(BAND, [{
    id: 'c-o-right', prompt: ['With 3 CO₂ and 7/2 H₂O, how many oxygen atoms are on the right?'],
    build: chemBlanks([{ parts: ['3 × 2 + 7/2 × 1 = ', { box: '9.5', tol: .01 }, { t: ' oxygen atoms', ui: true }],
      why: '3 CO₂ give 6; 7/2 H₂O give 3.5. 6 + 3.5 = 9.5 (a fraction we will clear soon).', hint: 'Each CO₂ has 2 O and each H₂O has 1 O. Add 3 × 2 and 3.5.' }]),
  }], done) }],
  ['fix-b', 'Oxygen last, then clear the fractions', (m) => {
    const s = S.sb, p = S.pb;
    hide(S.hNote, m('o'), .3);
    setCoef(s.row, 1, '19/4', m('o')); counts(s, [1, 4.75, 3, 3.5], m('o', .5));
    show(cT(p, '9.5 oxygen atoms ÷ 2 per O₂ = 19/4 O₂', 800, 640, { size: 32, font: CFONT, anchor: 'middle' }), m('o', .2));
    show(cT(p, '× 4 (clears both quarters and halves)', 800, 700, { size: 34, fill: COL.task, anchor: 'middle', weight: 700 }), m('x4'));
    [[0, 4], [1, 19], [2, 12], [3, 14]].forEach(([i, v], k) => setCoef(s.row, i, v, m('x4', .6 + k * .3)));
    counts(s, [4, 19, 12, 14], m('done'));
    show(cT(p, 'balanced: 4, 19, 12, 14', 800, 760, { size: 36, font: CFONT, fill: COL.good, anchor: 'middle', weight: 600 }), m('done', .5));
  }],
  ['propane', 'If the sheet meant propane', (m) => {
    const p = panel(0);
    show(cT(p, 'C₃H₇ is not a stable compound; propane is C₃H₈', 800, 200, { size: 34, weight: 600, anchor: 'middle' }), m('typo'));
    const row = eqRow(p, [{ ...C3H8, coef: 1 }, { ...O2, coef: 5 }, { ...CO2, coef: 3 }, { ...H2O, coef: 4 }], 2, 360, { size: 72 });
    show(row.g, m('prop'));
    show(cT(p, 'C 3 = 3   ·   H 8 = 8   ·   O 10 = 6 + 4', 800, 460, { size: 32, font: CFONT, fill: COL.good, anchor: 'middle' }), m('prop', .6));
    show(cT(p, 'Balance what is written on your test. If it says C₃H₇: 4, 19, 12, 14.', 800, 620, { size: 32, fill: COL.task, anchor: 'middle', weight: 600 }), m('test'));
  }],
  ['q3', 'Quick check', () => {
    const p = panel(0);
    show(cT(p, '1 C₃H₇ + 19/4 O₂ → 3 CO₂ + 7/2 H₂O', 800, 220, { size: 44, font: CFONT, anchor: 'middle' }), .2);
  }, { ask: done => quiz(BAND, [{
    id: 'c-times', prompt: ['To clear 19/4 and 7/2, multiply every coefficient by…'],
    build: choice([['4'], ['2'], ['19']], 0, '4 is the smallest number that makes both 19/4 and 7/2 whole: 19 and 14.',
      [null, '× 2 fixes 7/2 but leaves 19/4 as 19/2. You need 4.', '× 19 does not clear the quarters. The denominators are 4 and 2: use 4.']),
  }], done) }],
  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    [['Change coefficients only, never subscripts.', 'w1'], ['Start with the biggest formula; keep polyatomic groups like SO₄ together.', 'w2'],
      ['Balance single elements (O₂) last.', 'w3'], ['Fractions are fine for a moment; then multiply everything to clear them.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 230 + i * 120, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 260, size: 34, weight: 600 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
    srcBadge(p, 760, m('end'));
  }],
  ['final1', 'Chapter practice', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-al', prompt: ['Balance the equation. Leave a box empty for a coefficient of 1.'],
    build: coefBlanks([H2SO4, ALOH3, AL2SO43, H2O], 2, [3, 2, 1, 6], 'Same pattern as a: 2 Al(OH)₃ for 2 Al, 3 H₂SO₄ for 3 sulfates, then 6 H₂O for 12 H.'),
  }, {
    id: 'p-c4h10', prompt: ['Balance the burning of butane. Leave a box empty for a coefficient of 1.'],
    build: coefBlanks([C4H10, O2, CO2, H2O], 2, [2, 13, 8, 10], '4 CO₂ and 5 H₂O need 13/2 O₂; double everything: 2, 13, 8, 10.'),
  }], done, 'Chapter practice') }],
  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
</body>
</html>
