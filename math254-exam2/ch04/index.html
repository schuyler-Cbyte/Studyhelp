<script>
'use strict';
// Math 254 Exam 2 Review, Chapter 4. Study guide problems 6, 9, 11. Storyboard: books/math254-exam2/chapters/ch04.md.
const CHAPTER = { number: 4, title: 'The Cross Product', minutes: 7, language: 'en', next: '../ch05/' };

/* ---------- chapter data: a = (1, 2, 0), b = (0, 1, 3): a × b = (6, −3, 1), ‖a × b‖ = √46; c = (2, 0, 1): c · (a × b) = 13 (checked in ch04.md) ---------- */
const CA = COL.whole, CB = COL.nat, CN = COL.good;
// Isometric sketch: x down-left, y down-right, z up. a and b lie in the flat (z = 0) plane, so a × b points straight up.
const IO = { x: 400, y: 480 }, IS = 95;
const iso = (x, y, z) => [IO.x + IS * (y - x) * .866, IO.y + IS * (x + y) * .5 - IS * z];
const VA = [2, .5, 0], VB = [0, 2.4, 0], VN = [0, 0, 2.7];
function isoArrow(p, v, color, t0) { const [x, y] = iso(...v); return arrowPx(p, IO.x, IO.y, x, y, color, t0); }
function isoSquare(p, d1, d2, t0, s = .32) {   // right-angle mark at the origin between unit directions d1 and d2
  const q = (u, w) => iso(s * (u[0] + w[0]), s * (u[1] + w[1]), s * (u[2] + w[2])), z = [0, 0, 0];
  const [a, b, c] = [q(d1, z), q(d1, d2), q(d2, z)];
  show(path(p, `M${a}L${b}L${c}`, { stroke: COL.dim, 'stroke-width': 2.5 }, { o: 0 }), t0);
}
const unit = v => { const n = Math.hypot(...v); return v.map(c => c / n); };
function sketch(p, t0, { n = true, labels = true } = {}) {
  mk('circle', { cx: IO.x, cy: IO.y, r: 6, fill: COL.dim }, p);
  isoArrow(p, VA, CA, t0);
  isoArrow(p, VB, CB, t0 + .3);
  if (labels) {
    const [ax, ay] = iso(...VA), [bx, by] = iso(...VB);
    ml(p, ['a'], ax - 24, ay + 30, t0 + .4, { size: 38, fill: CA });
    ml(p, ['b'], bx + 26, by + 18, t0 + .6, { size: 38, fill: CB });
  }
}
const RX = 1150;

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'The cross product', (m) => {
    const p = panel(0);
    introCard(p, m, 'Cross Product and Proofs · Chapter 4', 'The Cross Product', 'a vector perpendicular to two others', 'Study guide problems 6, 9 and 11');
  }],
  ['compute', 'Computing a × b', (m) => {
    const p = panel(0);
    ml(p, ['a = (1, 2, 0),    b = (0, 1, 3)'], 800, 110, .3, { size: 44 });
    const D = mat(p, [['i', 'j', 'k'], ['1', '2', '0'], ['0', '1', '3']], 330, 360, m('det'), { size: 48, bars: true, cw: 82 });
    tx(p, 'a', D.x0 - 40, D.rowY(1) - 6, m('det', .5), { size: 30, fill: CA, anchor: 'middle' });
    tx(p, 'b', D.x0 - 40, D.rowY(2) - 6, m('det', .8), { size: 30, fill: CB, anchor: 'middle' });
    const cw = D.W / 3, MI = [[['2', '0'], ['1', '3']], [['1', '0'], ['0', '3']], [['1', '2'], ['0', '1']]];
    const TXT = [['= 2 · 3 − 0 · 1 = 6'], ['= −(1 · 3 − 0 · 0) = −3'], ['= 1 · 1 − 2 · 0 = 1']], KEY = ['i', 'j', 'k'], LAB = ['i:', 'j:  −', 'k:'];
    KEY.forEach((k, c) => {
      const y = 230 + c * 150, t0 = m(k);
      const band = mk('rect', { x: D.colX(c) - cw / 2 + 4, y: D.top - 6, width: cw - 8, height: D.H + 12, rx: 10, fill: COL.task }, p);
      put(band, { o: 0 }); tw(band, { o: .22 }, t0, .3); tw(band, { o: 0 }, t0 + 4.5, .4);
      ml(p, [LAB[c]], 700, y + 12, t0 + .3, { size: 38, anchor: 'end', fill: COL.task });
      const mm = mat(p, MI[c], 780, y, t0 + .5, { size: 36, bars: true });
      ml(p, TXT[c], mm.x1 + 18, y + 12, t0 + 1.2, { size: 38, anchor: 'start' });
    });
    const a = ml(p, ['a × b = (6, −3, 1)'], 800, 760, m('ans'), { size: 52, fill: COL.good });
    boxMath(p, a, 800, 760, 52, m('ans', .5));
  }],
  ['perp', 'Perpendicular to both', (m) => {
    const p = panel(0);
    const [ax, ay] = iso(...VA), [bx, by] = iso(...VB), [sx, sy] = iso(VA[0] + VB[0], VA[1] + VB[1], 0);
    const pl = path(p, `M${IO.x} ${IO.y}L${ax} ${ay}L${sx} ${sy}L${bx} ${by}Z`, { fill: COL.chalk, 'fill-opacity': .07, stroke: COL.faint, 'stroke-width': 2 }, { o: 0 });
    show(pl, m('ab'));
    sketch(p, m('ab', .2));
    isoArrow(p, VN, CN, m('n'));
    const [nx, ny] = iso(...VN);
    ml(p, ['a × b'], nx + 70, ny + 10, m('n', .4), { size: 38, fill: CN });
    isoSquare(p, unit(VA), [0, 0, 1], m('n', 1));
    isoSquare(p, unit(VB), [0, 0, 1], m('n', 1.3));
    tx(p, 'right-hand rule: fingers a → b, thumb along a × b', 400, 800, m('rh'), { size: 26, fill: COL.dim, anchor: 'middle' });
    ml(p, ['a × b ⊥ a   and   a × b ⊥ b'], RX, 200, m('n', 1.5), { size: 44, fill: CN });
    ml(p, ['(1, 2, 0) · (6, −3, 1) = 6 − 6 + 0 = 0  ✓'], RX, 360, m('check'), { size: 38 });
    ml(p, ['(0, 1, 3) · (6, −3, 1) = 0 − 3 + 3 = 0  ✓'], RX, 460, m('check2'), { size: 38 });
  }],
  ['q1', 'Quick check', () => {
    const p = panel(0);
    tx(p, 'cover a column,  2 × 2 determinant,  flip the middle sign', 800, 380, .2, { size: 40, fill: COL.task, anchor: 'middle', weight: 600 });
  }, { ask: done => quiz(BAND, [{
    id: 'c-cross', prompt: ['Compute ', $m('(2, 0, 1) × (1, 1, 0)'), '.'],
    build: blanks([{ parts: ['(', { box: '-1' }, ', ', { box: '1' }, ', ', { box: '2' }, ')'], why: '(0 · 0 − 1 · 1, −(2 · 0 − 1 · 1), 2 · 1 − 0 · 1) = (−1, 1, 2).',
      hint: 'First: cover column 1: 0 · 0 − 1 · 1. Middle: −(2 · 0 − 1 · 1). Last: 2 · 1 − 0 · 1.' }]),
  }], done) }],
  ['area', 'Area and the triple product', (m) => {
    const p = panel(0);
    const [ax, ay] = iso(...VA), [bx, by] = iso(...VB), [sx, sy] = iso(VA[0] + VB[0], VA[1] + VB[1], 0);
    sketch(p, .2);
    const pl = path(p, `M${IO.x} ${IO.y}L${ax} ${ay}L${sx} ${sy}L${bx} ${by}Z`, { fill: COL.task, 'fill-opacity': .25, stroke: COL.task, 'stroke-width': 2.5 }, { o: 0 });
    show(pl, m('para'));
    tx(p, 'area', (IO.x + sx) / 2, (IO.y + sy) / 2 + 10, m('para', .4), { size: 30, fill: COL.task, anchor: 'middle', weight: 600 });
    ml(p, ['area = ‖a × b‖'], RX, 170, m('rule'), { size: 48, fill: COL.task });
    const a = ml(p, ['= ', R('36 + 9 + 1'), ' = ', R('46')], RX, 270, m('calc'), { size: 46, fill: COL.good });
    boxMath(p, a, RX, 270, 46, m('calc', 2.5));
    ml(p, ['c · (a × b)'], RX, 420, m('triple'), { size: 48, fill: COL.task });
    ml(p, ['= (2, 0, 1) · (6, −3, 1) = 12 + 0 + 1 = 13'], RX, 510, m('tcalc'), { size: 38 });
    tx(p, 'a scalar', RX, 560, m('tcalc', 1), { size: 28, fill: COL.task, anchor: 'middle', weight: 600 });
    ml(p, ['u × (v × w)'], RX, 680, m('nested'), { size: 44 });
    tx(p, 'inner parentheses first', RX, 735, m('nested', .4), { size: 28, fill: COL.task, anchor: 'middle', weight: 600 });
  }],
  ['q2', 'Quick check', () => {
    const p = panel(0);
    ml(p, ['area = ‖a × b‖'], 800, 380, .2, { size: 60, fill: COL.task });
  }, { ask: done => quiz(BAND, [{
    id: 'c-area', prompt: ['Area of the parallelogram formed by ', $m('(1, 1, 0)'), ' and ', $m('(0, 1, 1)'), ':'],
    build: blanks([{ parts: ['area = √', { box: '3' }], why: '(1, 1, 0) × (0, 1, 1) = (1, −1, 1), and its length is √(1 + 1 + 1) = √3.',
      hint: 'First compute the cross product, (1, −1, 1); then its length.' }]),
  }], done) }],
  ['rules', 'Rules for proofs', (m) => {
    const p = panel(0);
    const RU = [['v × v = 0', 'r1'], ['v × u = −(u × v)', 'r2'], ['(ku) × v = k(u × v)', 'r3'], ['u × (v + w) = u × v + u × w', 'r4'], ['(u × v) × w ≠ u × (v × w)', 'r5']];
    RU.forEach(([s, k], i) => ml(p, [s], 140, 170 + i * 105, m(k), { size: 40, anchor: 'start', fill: i === 4 ? COL.bad : COL.chalk }));
    tx(p, 'in general', 140, 640, m('r5', .6), { size: 24, fill: COL.bad });
    path(p, 'M820 120V700', { stroke: COL.faint, 'stroke-width': 2 });
    tx(p, 'Prove:', 900, 190, m('ex'), { size: 30, fill: COL.dim });
    ml(p, ['u × (u + v) = u × v'], 1200, 260, m('ex', .3), { size: 44, fill: COL.task });
    ml(p, ['u × (u + v) = u × u + u × v'], 900, 380, m('s1'), { size: 40, anchor: 'start' });
    tx(p, 'distribute', 1460, 430, m('s1', .4), { size: 24, fill: COL.dim, anchor: 'end' });
    ml(p, ['= 0 + u × v'], 1060, 500, m('s2'), { size: 40, anchor: 'start' });
    tx(p, 'u × u = 0', 1460, 550, m('s2', .4), { size: 24, fill: COL.dim, anchor: 'end' });
    const a = ml(p, ['= u × v'], 1060, 620, m('s3'), { size: 40, anchor: 'start', fill: COL.good });
    pulse(a, m('s3', .5), 1);
  }],
  ['q3', 'Quick check', () => {
    const p = panel(0);
    tx(p, 'always true,  or  sometimes false?', 800, 200, .2, { size: 46, fill: COL.task, anchor: 'middle', weight: 600 });
  }, { ask: done => quiz(WIDE, [{
    id: 'c-crosstf', prompt: ['u and v are vectors in ℝ³.'],
    build: grid([
      { parts: ['u × v = v × u'], ans: ['F'], why: 'Switching the order flips the sign: i × j = k but j × i = −k.' },
      { parts: ['u · (u × v) = 0'], ans: ['T'], why: 'u × v is perpendicular to u.' },
      { parts: ['u × v = 0  only if  u = 0  or  v = 0'], ans: ['F'], why: 'Parallel vectors also give 0: u × 2u = 0.' },
    ], VTF, { multi: false }),
  }], done) }],
  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    wrapList(p, m, [['Cover a column, 2 × 2 determinant, flip the middle sign.', 'w1'], ['a × b is perpendicular to both a and b.', 'w2'],
      ['Area = ‖a × b‖; the triple product is a scalar.', 'w3'], ['Proofs: v × v = 0, order flips the sign, grouping matters.', 'w4']]);
  }],
  ['final1', PRACT, () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-hw6vw', prompt: [fromHW(6), $m('u = (3, −2, 0)'), ', ', $m('v = (1, −1, −2)'), ', ', $m('w = (1, 1, −3)'), '. First compute ', $m('v × w'), '.'],
    build: blanks([{ parts: ['v × w = (', { box: '5' }, ', ', { box: '1' }, ', ', { box: '2' }, ')'], why: '((−1)(−3) − (−2)(1), −(1 · (−3) − (−2)(1)), 1 · 1 − (−1)(1)) = (5, 1, 2).',
      hint: 'Middle component: −(1 · (−3) − (−2) · 1) = −(−3 + 2) = 1.' }]),
  }, {
    id: 'p-hw6a', prompt: ['(a) ', $m('u · (v × w)'), ' ='],
    build: blanks([{ parts: [{ box: '13' }], why: '(3, −2, 0) · (5, 1, 2) = 15 − 2 + 0 = 13.', hint: 'Dot u with the vector you just found.' }]),
  }, {
    id: 'p-hw6b', prompt: ['(b) ', $m('u × (v × w)'), ' ='],
    build: blanks([{ parts: ['(', { box: '-4' }, ', ', { box: '-6' }, ', ', { box: '13' }, ')'], why: '(3, −2, 0) × (5, 1, 2) = (−4 − 0, −(6 − 0), 3 + 10) = (−4, −6, 13).',
      hint: 'Cross u = (3, −2, 0) with (5, 1, 2). Remember the middle minus sign.' }]),
  }, {
    id: 'p-hw6c', prompt: ['(c) Area of the parallelogram formed by u and v. (', $m('u × v = (4, 6, −1)'), '.)'],
    build: blanks([{ parts: ['area = √', { box: '53' }], why: '16 + 36 + 1 = 53.', hint: 'The area is the length of u × v.' }]),
  }, {
    id: 'p-hw9', prompt: [fromHW(9), 'In the proof of ', $m('(u + kv) × v = u × v'), ', after distributing and pulling out k, which fact finishes it?'],
    build: choice([[$m('v × v = 0')], [$m('u × v = v × u')], [$m('u · v = 0')]], 0,
      '(u + kv) × v = u × v + k(v × v) = u × v + 0. Write each step with the rule it uses.',
      [null, 'That is false: switching the order flips the sign. And it is not needed here.', 'Nothing says u and v are orthogonal; the proof works for all u, v.']),
  }, {
    id: 'p-hw11', prompt: [fromHW(11), 'Always true, or sometimes false? (u, v, w in ℝ³; justify each in your write-up.)'],
    build: grid([
      { parts: ['(a)  if u × w = v × w, then u = v'], ans: ['F'], why: 'Try w = 0: then u × w = v × w for any u and v.' },
      { parts: ['(b)  (u × v) · (u + v) = 0'], ans: ['T'], why: 'u × v is perpendicular to u and to v, so to u + v.' },
      { parts: ['(c)  (u × v) × w = u × (v × w)'], ans: ['F'], why: 'Not associative: (i × i) × j = 0, but i × (i × j) = i × k = −j.' },
    ], VTF, { multi: false }),
  }], done, PRACT) }],
  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
