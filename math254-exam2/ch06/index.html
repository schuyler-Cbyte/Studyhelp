<script>
'use strict';
// Math 254 Exam 2 Review, Chapter 6. Study guide problems 12, 13, 30(a). Storyboard: books/math254-exam2/chapters/ch06.md.
const CHAPTER = { number: 6, title: 'Vector Space Axioms', minutes: 6, language: 'en', next: '../ch07/' };

/* ---------- chapter data: ℝ² with k ⊙ (x, y) = (kx, 0) fails only 1u = u; {(x, y): x ≥ 0} fails closure under scalars and inverses (checked in ch06.md) ---------- */
const GROUPS = [
  ['Closure', 'clo', COL.whole, 120, ['u + v is in V', 'ku is in V']],
  ['Addition', 'add', COL.nat, 560, ['u + v = v + u', '(u + v) + w = u + (v + w)', 'u + 0 = u', 'u + (−u) = 0']],
  ['Scalar multiplication', 'mul', COL.rat, 1080, ['k(u + v) = ku + kv', '(k + m)u = ku + mu', 'k(mu) = (km)u', '1u = u']],
];
const HX = [['H', 'holds', COL.good], ['X', 'fails', COL.bad]];   // keys 1, 2
// A verdict in an outlined pill, faded in at t0.
function verdict(p, s, x, y, t0, color = COL.bad) {
  const g = G(p, { o: 0 }), w = uiW(s, 30) + 44;
  mk('rect', { x: x - w / 2, y: y - 36, width: w, height: 54, rx: 27, fill: 'none', stroke: color, 'stroke-width': 2.5 }, g);
  T(g, s, { x, y, size: 30, fill: color, weight: 600, anchor: 'middle' });
  show(g, t0);
  return g;
}

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Vector space axioms', (m) => {
    const p = panel(0);
    introCard(p, m, 'Vector Spaces and Subspaces · Chapter 6', 'Vector Space Axioms', 'ten rules every vector space follows', 'Study guide problems 12, 13 and 30(a)');
  }],
  ['axioms', 'The ten axioms', (m) => {
    const p = panel(0);
    let n = 1;
    GROUPS.forEach(([name, k, c, x, items]) => {
      tx(p, name, x, 190, m(k), { size: 32, fill: c, weight: 700 });
      draw(path(p, `M${x} 210H${x + 380}`, { stroke: c, 'stroke-width': 2.5 }, { d: 0 }), m(k, .2), .5);
      items.forEach((s, i) => {
        const t0 = m(k, .5 + i * .5);
        tx(p, String(n++), x, 280 + i * 85, t0, { size: 22, fill: COL.dim });
        ml(p, [s], x + 36, 280 + i * 85, t0, { size: 34, anchor: 'start' });
      });
    });
    tx(p, 'one axiom fails  →  not a vector space', 800, 700, m('fail'), { size: 34, fill: COL.bad, anchor: 'middle', weight: 600 });
  }],
  ['test', 'Testing an operation', (m) => {
    const p = panel(0);
    ml(p, ['ℝ² with the usual + and   k ⊙ (x, y) = (kx, 0)'], 800, 110, m('set'), { size: 42, fill: COL.task });
    tx(p, 'compute both sides with general vectors', 800, 165, m('how'), { size: 26, fill: COL.dim, anchor: 'middle' });
    const rows = [['k ⊙ (u + v) = k ⊙ u + k ⊙ v', 'both:  (k(x₁ + x₂), 0)', 'a1', true], ['(k + m) ⊙ u = k ⊙ u + m ⊙ u', 'both:  ((k + m)x, 0)', 'a2', true],
      ['k ⊙ (m ⊙ u) = (km) ⊙ u', 'both:  (kmx, 0)', 'a3', true], ['1 ⊙ u = u', '1 ⊙ (x, y) = (x, 0) ≠ (x, y)', 'a4', false]];
    rows.forEach(([ax, res, k, ok], i) => {
      const y = 260 + i * 95;
      ml(p, [ax], 130, y, m(k), { size: 36, anchor: 'start' });
      ml(p, [res], 820, y, m(k, .8), { size: 36, anchor: 'start', fill: ok ? COL.chalk : COL.bad });
      ml(p, [ok ? '✓' : '✗'], 1460, y, m(k, 1.6), { size: 40, fill: ok ? COL.good : COL.bad });
    });
    ml(p, ['example:   1 ⊙ (2, 3) = (2, 0) ≠ (2, 3)'], 800, 660, m('num'), { size: 40, fill: COL.task });
    verdict(p, 'not a vector space:  1u = u fails', 800, 765, m('no'));
  }],
  ['q1', 'Quick check', () => {
    const p = panel(0);
    ml(p, ['k ⊙ (x, y) = (2kx, 2ky)'], 800, 200, .2, { size: 56, fill: COL.task });
  }, { ask: done => quiz(WIDE, [{
    id: 'c-axioms', prompt: ['ℝ² with the usual addition and ', $m('k ⊙ (x, y) = (2kx, 2ky)'), '. Does each axiom hold?'],
    build: grid([
      { parts: ['k ⊙ (u + v) = k ⊙ u + k ⊙ v'], ans: ['H'], why: 'Both sides are 2k(u + v).' },
      { parts: ['(k + m) ⊙ u = k ⊙ u + m ⊙ u'], ans: ['H'], why: '2(k + m)u = 2ku + 2mu.' },
      { parts: ['k ⊙ (m ⊙ u) = (km) ⊙ u'], ans: ['X'], why: 'Left: 2k(2mu) = 4kmu. Right: 2kmu.' },
      { parts: ['1 ⊙ u = u'], ans: ['X'], why: '1 ⊙ (x, y) = (2x, 2y), not (x, y).' },
    ], HX, { multi: false }),
  }], done) }],
  ['set', 'When the set is the problem', (m) => {
    const p = panel(0);
    const P = plane(p, { cx: 455, cy: 450, u: 70, x0: -4, x1: 4, y0: -3, y1: 3, t0: .1 });
    P.layer = p;
    P.half(1, 0, 0, COL.whole, m('set'), { o: .18 });
    ml(p, ['{ (x, y) : x ≥ 0 }'], 1180, 160, m('set'), { size: 46, fill: COL.whole });
    P.arrow(0, 0, 2, 1, COL.chalk, m('sum'), { label: 'u' });
    P.arrow(0, 0, 1, -2, COL.chalk, m('sum', .4));
    P.arrow(0, 0, 3, -1, COL.good, m('sum', 1));
    ml(p, ['u + v'], P.PX(3) + 34, P.PY(-1) + 34, m('sum', 1.3), { size: 28, fill: COL.good });
    ml(p, ['sums stay on the right  ✓'], 1180, 280, m('sum', .8), { size: 38, fill: COL.good });
    P.arrow(0, 0, -2, -1, COL.bad, m('neg'));
    ml(p, ['−1u'], P.PX(-2) - 30, P.PY(-1) + 34, m('neg', .3), { size: 30, fill: COL.bad });
    ml(p, ['(−1)(2, 1) = (−2, −1)   ✗'], 1180, 400, m('neg', .5), { size: 38, fill: COL.bad });
    tx(p, 'not closed under scalar multiplication', 1180, 500, m('clo'), { size: 28, fill: COL.bad, anchor: 'middle', weight: 600 });
    tx(p, 'no negative for (2, 1) in the set', 1180, 560, m('inv'), { size: 28, fill: COL.bad, anchor: 'middle', weight: 600 });
    verdict(p, 'not a vector space', 1180, 680, m('inv', 1.5));
  }],
  ['multiples', 'All the multiples', (m) => {
    const p = panel(0), X0 = 700, U = 150, Y = 380;
    draw(path(p, `M${X0 - 3.6 * U} ${Y}H${X0 + 5.2 * U}`, { stroke: COL.faint, 'stroke-width': 2.5 }, { d: 0 }), m('v'), .6);
    mk('circle', { cx: X0, cy: Y, r: 6, fill: COL.dim }, p);
    tx(p, '0', X0, Y + 40, m('v'), { size: 24, fill: COL.dim, anchor: 'middle' });
    arrowPx(p, X0, Y, X0 + U, Y, COL.whole, m('v', .3));
    ml(p, ['v'], X0 + U / 2, Y - 18, m('v', .5), { size: 36, fill: COL.whole });
    [[2, '2v'], [-1, '−v'], [.5, '½v'], [3, '3v'], [-2, '−2v'], [-3, '−3v'], [5, '5v']].forEach(([k, s], i) => {
      const d = G(p, { x: X0 + k * U, y: Y, s: 0, o: 0 });
      mk('circle', { r: 9, fill: COL.task }, d);
      pop(d, m('mult', .3 + i * .45));
      ml(p, [s], X0 + k * U, Y + 50, m('mult', .45 + i * .45), { size: 30, fill: COL.task });
    });
    tx(p, '… all different: infinitely many vectors', 800, 520, m('diff'), { size: 32, fill: COL.task, anchor: 'middle', weight: 600 });
    ml(p, ['{ 0 }'], 800, 660, m('zero'), { size: 48, fill: COL.good });
    tx(p, 'the zero space: the only finite vector space', 800, 720, m('zero', .4), { size: 28, fill: COL.good, anchor: 'middle' });
  }],
  ['q2', 'Quick check', () => {
    const p = panel(0);
    ml(p, ['{ (x, y) : x and y are integers }'], 800, 380, .2, { size: 52, fill: COL.task });
  }, { ask: done => quiz(LOW, [{
    id: 'c-integers', prompt: ['With the usual operations, is the set of all ', $m('(x, y)'), ' with integer x and y a vector space?'],
    build: choice([['No: ½(1, 0) = (½, 0) is not in the set.'], ['Yes: sums of integers are integers.'], ['No: it has no zero vector.']], 0,
      'Closure under scalar multiplication fails: scalars can be any real number.',
      [null, 'Closure under addition holds, but every axiom must hold, including closure under scalar multiplication.', '(0, 0) has integer coordinates, so the zero vector is in the set.']),
  }], done) }],
  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    wrapList(p, m, [['Ten axioms: 2 closure, 4 addition, 4 scalar multiplication.', 'w1'], ['Test an operation: compute both sides with general vectors.', 'w2'],
      ['One specific example proves an axiom fails.', 'w3'], ['A nonzero vector brings all its multiples: {0} or infinite.', 'w4']]);
  }],
  ['final1', PRACT, () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-hw12', prompt: [fromHW(12), 'Triples of real numbers, the standard addition, and ', $m('k ⊙ (x, y, z) = (k', E(2), 'x, k', E(2), 'y, k', E(2), 'z)'), '. Does each scalar axiom hold?'],
    build: grid([
      { parts: ['k ⊙ (u + v) = k ⊙ u + k ⊙ v'], ans: ['H'], why: 'Compare k²(u + v) with k²u + k²v.' },
      { parts: ['(k + m) ⊙ u = k ⊙ u + m ⊙ u'], ans: ['X'], why: 'Compare (k + m)² with k² + m²; try k = m = 1.' },
      { parts: ['k ⊙ (m ⊙ u) = (km) ⊙ u'], ans: ['H'], why: 'Compare k²m² with (km)².' },
      { parts: ['1 ⊙ u = u'], ans: ['H'], why: '1² = 1.' },
    ], HX, { multi: false }),
  }, {
    id: 'p-hw12b', prompt: ['Problem 12, conclusion. With these operations the set is'],
    build: choice([['not a vector space.'], ['a vector space.']], 0, 'One failing axiom is enough. In your write-up, name it and give a numerical example where it fails.',
      [null, 'One axiom fails, so it is not a vector space.']),
  }, {
    id: 'p-hw13', prompt: [fromHW(13), 'All n × n invertible matrices, standard operations. Does each axiom hold?'],
    build: grid([
      { parts: ['closed under addition'], ans: ['X'], why: 'Is I + (−I) invertible?' },
      { parts: ['contains a zero vector'], ans: ['X'], why: 'Is the zero matrix invertible?' },
      { parts: ['closed under scalar multiplication'], ans: ['X'], why: 'Try the scalar k = 0.' },
      { parts: ['A + B = B + A'], ans: ['H'], why: 'Matrix addition is commutative.' },
    ], HX, { multi: false, text: true }),
  }, {
    id: 'p-hw30a', prompt: [fromHW('30(a)'), 'There is a vector space consisting of exactly two distinct vectors.'],
    build: grid([{ parts: ['(a)'], ans: ['F'], why: 'One of the two vectors is nonzero, and all its multiples must be in the space too.' }], VTF, { multi: false }),
  }], done, PRACT) }],
  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
