<script>
'use strict';
// Math 254 Exam 2 Review, Chapter 5. Study guide problems 7, 8, 10 (taught through parallel proofs). Storyboard: books/math254-exam2/chapters/ch05.md.
const CHAPTER = { number: 5, title: 'Vector Proofs and True or False', minutes: 6, language: 'en', next: '../ch06/' };

/* ---------- chapter data: the worked identity is ‖u + v‖² − ‖u − v‖² = 4u · v (not a study-guide problem) ---------- */
const CU = COL.whole, CV = COL.nat, CW = COL.rat;
const SQ = s => [s, E(2)];
// Proof columns: the three terms of each expansion line up under each other.
const LX = 960, TX = [1070, 1260, 1450];
// Isometric sketch for the orthogonality proof: x down-left, y down-right, z up.
const IO = { x: 380, y: 500 }, IS = 90;
const iso = (x, y, z) => [IO.x + IS * (y - x) * .866, IO.y + IS * (x + y) * .5 - IS * z];
const isoArrow = (p, v, color, t0) => { const [x, y] = iso(...v); return arrowPx(p, IO.x, IO.y, x, y, color, t0); };

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Vector proofs', (m) => {
    const p = panel(0);
    introCard(p, m, 'Cross Product and Proofs · Chapter 5', 'Vector Proofs and True or False', 'prove it for every vector, or break it with one', 'Study guide problems 7, 8 and 10');
  }],
  ['tools', 'Norms as dot products', (m) => {
    const p = panel(0);
    ml(p, [...SQ('‖x‖'), ' = x · x'], 800, 140, m('sq'), { size: 56, fill: COL.task });
    ml(p, ['u · (v + w) = u · v + u · w          u · v = v · u'], 800, 225, m('rules'), { size: 36, fill: COL.dim });
    ml(p, ['(u + v) · (u + v)'], 800, 320, m('ex'), { size: 46 });
    const X0 = 600, Y0 = 400, CW2 = 200, CH = 90;
    draw(path(p, `M${X0} ${Y0}H${X0 + 2 * CW2}V${Y0 + 2 * CH}H${X0}ZM${X0 + CW2} ${Y0}V${Y0 + 2 * CH}M${X0} ${Y0 + CH}H${X0 + 2 * CW2}`, { stroke: COL.faint, 'stroke-width': 2.5 }, { d: 0 }), m('ex', .4), .8);
    [['u', CU], ['v', CV]].forEach(([s, c], i) => {
      ml(p, [s], X0 + CW2 * (i + .5), Y0 - 18, m('ex', .8), { size: 36, fill: c });
      ml(p, [s], X0 - 34, Y0 + CH * (i + .5) + 12, m('ex', .8), { size: 36, fill: c });
    });
    [[1, 0], [0, 1]].forEach(([c, r]) => {   // the two equal middle pieces light up
      const b = mk('rect', { x: X0 + CW2 * c + 6, y: Y0 + CH * r + 6, width: CW2 - 12, height: CH - 12, rx: 10, fill: COL.task }, p);
      put(b, { o: 0 }); tw(b, { o: .25 }, m('comb'), .4);
    });
    [['u · u', 0, 0, 'g1'], ['u · v', 1, 0, 'g2'], ['v · u', 0, 1, 'g3'], ['v · v', 1, 1, 'g4']].forEach(([s, c, r, k]) =>
      ml(p, [s], X0 + CW2 * (c + .5), Y0 + CH * (r + .5) + 14, m(k), { size: 40 }));
    const a = ml(p, ['= u · u + 2u · v + v · v'], 800, 720, m('comb', .6), { size: 48, fill: COL.good });
    boxMath(p, a, 800, 720, 48, m('comb', 1.2));
  }],
  ['proof', 'A proof by expanding', (m) => {
    const p = panel(0);
    const O = [130, 640], U = [340, 40], V = [120, -250];
    const A = [O[0] + U[0], O[1] + U[1]], C = [O[0] + V[0], O[1] + V[1]], B = [A[0] + V[0], A[1] + V[1]];
    ml(p, [...SQ('‖u + v‖'), ' − ', ...SQ('‖u − v‖'), ' = 4u · v'], 1010, 130, .3, { size: 48, fill: COL.task });
    show(path(p, `M${O}L${A}L${B}L${C}Z`, { stroke: COL.faint, 'stroke-width': 2, fill: 'none' }, { o: 0 }), m('pic'));
    arrowPx(p, O[0], O[1], A[0], A[1], CU, m('pic', .2));
    arrowPx(p, O[0], O[1], C[0], C[1], CV, m('pic', .4));
    ml(p, ['u'], (O[0] + A[0]) / 2, (O[1] + A[1]) / 2 + 46, m('pic', .4), { size: 34, fill: CU });
    ml(p, ['v'], (O[0] + C[0]) / 2 - 26, (O[1] + C[1]) / 2, m('pic', .6), { size: 34, fill: CV });
    arrowPx(p, O[0], O[1], B[0], B[1], COL.good, m('pic', 1.2));
    ml(p, ['u + v'], B[0] + 10, B[1] - 20, m('pic', 1.4), { size: 32, fill: COL.good });
    arrowPx(p, C[0], C[1], A[0], A[1], COL.int, m('pic', 2.2));
    ml(p, ['u − v'], (C[0] + A[0]) / 2 + 64, (C[1] + A[1]) / 2 + 10, m('pic', 2.4), { size: 32, fill: COL.int });
    const rows = [[SQ('‖u + v‖'), ['u · u', '+ 2u · v', '+ v · v'], 's1', 280], [SQ('‖u − v‖'), ['u · u', '− 2u · v', '+ v · v'], 's2', 380]];
    rows.forEach(([lhs, terms, k, y]) => {
      ml(p, [...lhs, ' ='], LX, y, m(k), { size: 40, anchor: 'end' });
      terms.forEach((s, j) => ml(p, [s], TX[j], y, m(k, .3 + j * .3), { size: 40 }));
    });
    draw(path(p, `M${LX - 230} 415H${TX[2] + 90}`, { stroke: COL.chalk, 'stroke-width': 3 }, { d: 0 }), m('sub'), .5);
    tx(p, 'subtract', LX - 220, 455, m('sub'), { size: 26, fill: COL.dim });
    [0, 2].forEach(j => [280, 380].forEach((y, r) => draw(path(p, `M${TX[j] - 60} ${y - 6}L${TX[j] + 60} ${y - 22}`, { stroke: COL.bad, 'stroke-width': 4 }, { d: 0 }), m('cancel', j * .4 + r * .2), .3)));
    ml(p, ['0'], TX[0], 490, m('cancel', .6), { size: 40, fill: COL.dim });
    ml(p, ['0'], TX[2], 490, m('cancel', 1.2), { size: 40, fill: COL.dim });
    ml(p, ['4u · v'], TX[1], 490, m('left', 1), { size: 40, fill: COL.task });
    const a = ml(p, [...SQ('‖u + v‖'), ' − ', ...SQ('‖u − v‖'), ' = 4u · v'], 1100, 640, m('ans'), { size: 46, fill: COL.good });
    boxMath(p, a, 1100, 640, 46, m('ans', .6));
  }],
  ['q1', 'Quick check', () => {
    const p = panel(0);
    ml(p, [...SQ('‖x‖'), ' = x · x'], 800, 380, .2, { size: 64, fill: COL.task });
  }, { ask: done => quiz(LOW, [{
    id: 'c-expand', prompt: ['Expand ', $m('(u − v) · (u − v)'), '.'],
    build: choice([[$m('u · u − 2u · v + v · v')], [$m('u · u − v · v')], [$m('u · u − 2u · v − v · v')]], 0,
      'Four pieces: u · u − u · v − v · u + v · v, and the middle two combine.',
      [null, 'Two middle pieces are missing: −u · v and −v · u.', '(−v) · (−v) = +v · v: two minus signs multiply to plus.']),
  }], done) }],
  ['orth', 'Proving orthogonality', (m) => {
    const p = panel(0);
    ml(p, ['u · v = 0   and   u · w = 0'], 1120, 150, m('claim'), { size: 42 });
    tx(p, 'given', 1120, 200, m('claim', .4), { size: 26, fill: COL.dim, anchor: 'middle' });
    mk('circle', { cx: IO.x, cy: IO.y, r: 6, fill: COL.dim }, p);
    isoArrow(p, [0, 0, 3], CU, m('pic'));
    isoArrow(p, [2, .3, 0], CV, m('pic', .4));
    isoArrow(p, [.2, 2.2, 0], CW, m('pic', .7));
    const [ux, uy] = iso(0, 0, 3), [vx, vy] = iso(2, .3, 0), [wx, wy] = iso(.2, 2.2, 0), [sx, sy] = iso(2.2, 2.5, 0);
    ml(p, ['u'], ux - 28, uy + 20, m('pic', .3), { size: 36, fill: CU });
    ml(p, ['v'], vx - 26, vy + 22, m('pic', .6), { size: 36, fill: CV });
    ml(p, ['w'], wx + 28, wy + 10, m('pic', .9), { size: 36, fill: CW });
    show(path(p, `M${vx} ${vy}L${sx} ${sy}L${wx} ${wy}`, { stroke: COL.faint, 'stroke-width': 2, 'stroke-dasharray': '6 7' }, { o: 0 }), m('sum'));
    isoArrow(p, [2.2, 2.5, 0], COL.good, m('sum', .3));
    ml(p, ['v + w'], sx, sy + 46, m('sum', .7), { size: 34, fill: COL.good });
    const q = (a, b) => iso(.3 * (a[0] + b[0]), .3 * (a[1] + b[1]), .3 * (a[2] + b[2])), d = [2.2, 2.5, 0].map(c => c / Math.hypot(2.2, 2.5)), z = [0, 0, 1], o = [0, 0, 0];
    show(path(p, `M${q(d, o)}L${q(d, z)}L${q(z, o)}`, { stroke: COL.dim, 'stroke-width': 2.5 }, { o: 0 }), m('sum', 1));
    tx(p, 'show:', 760, 300, m('goal'), { size: 28, fill: COL.dim });
    ml(p, ['u · (v + w) = 0'], 1120, 300, m('goal'), { size: 44, fill: COL.task });
    ml(p, ['u · (v + w) = u · v + u · w'], 1120, 420, m('s1'), { size: 42 });
    ml(p, ['= 0 + 0'], 1120, 510, m('s2'), { size: 42 });
    const a = ml(p, ['= 0'], 1120, 610, m('ans'), { size: 48, fill: COL.good });
    boxMath(p, a, 1120, 610, 48, m('ans', .4));
    tx(p, 'so u ⊥ v + w', 1120, 690, m('ans', .8), { size: 30, fill: COL.good, anchor: 'middle', weight: 600 });
  }],
  ['tf', 'True or false?', (m) => {
    const p = panel(0);
    tx(p, 'always true: an argument for every vector      sometimes false: one counterexample', 800, 100, m('rule'), { size: 28, fill: COL.task, anchor: 'middle', weight: 600 });
    ml(p, ['if u · v = 0, then u = 0 or v = 0'], 600, 200, m('st1'), { size: 42 });
    ml(p, ['u = (1, 0),    v = (0, 1)'], 600, 280, m('try'), { size: 40, fill: COL.task });
    ml(p, ['u · v = 0 + 0 = 0'], 600, 350, m('dot'), { size: 40 });
    tx(p, 'but neither is the zero vector', 600, 405, m('nz'), { size: 28, fill: COL.bad, anchor: 'middle' });
    chipTxt(p, 'sometimes false', 1260, 290, m('f1'));
    ml(p, ['‖ku‖ = k‖u‖'], 600, 520, m('st2'), { size: 42 });
    ml(p, ['k = −1,    u = (1, 0)'], 600, 595, m('try2'), { size: 40, fill: COL.task });
    ml(p, ['‖−u‖ = 1'], 470, 670, m('lhs'), { size: 40 });
    ml(p, ['k‖u‖ = −1'], 760, 670, m('rhs'), { size: 40 });
    chipTxt(p, 'sometimes false', 1260, 595, m('rhs', 1));
    ml(p, ['‖ku‖ = |k| ‖u‖'], 1260, 700, m('fix'), { size: 42, fill: COL.good });
    tx(p, 'the true rule', 1260, 750, m('fix', .4), { size: 24, fill: COL.good, anchor: 'middle' });
  }],
  ['q2', 'Quick check', () => {
    const p = panel(0);
    tx(p, 'always true,  or  sometimes false?', 800, 200, .2, { size: 46, fill: COL.task, anchor: 'middle', weight: 600 });
  }, { ask: done => quiz(WIDE, [{
    id: 'c-tf', prompt: ['u and v are vectors in ℝⁿ.'],
    build: grid([
      { parts: ['u · v = v · u'], ans: ['T'], why: 'Both sums are u₁v₁ + u₂v₂ + …, in a different order.' },
      { parts: ['‖u‖ = 0 only when u = 0'], ans: ['T'], why: '‖u‖² is a sum of squares; it is 0 only if every component is 0.' },
      { parts: [...SQ('‖u + v‖'), ' = ', ...SQ('‖u‖'), ' + ', ...SQ('‖v‖')], ans: ['F'], why: 'The expansion has + 2u · v. Try u = v = (1, 0): 4 ≠ 2.' },
      { parts: ['if u ⊥ v, then u ⊥ 3v'], ans: ['T'], why: 'u · (3v) = 3(u · v) = 0.' },
    ], VTF, { multi: false }),
  }], done) }],
  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    wrapList(p, m, [['Turn norms into dot products: ‖x‖² = x · x.', 'w1'], ['Expand like multiplying sums; the order of a dot product doesn’t matter.', 'w2'],
      ['Orthogonal: show the dot product is 0, using the assumptions.', 'w3'], ['Sometimes false: one specific counterexample.', 'w4']]);
  }],
  ['final1', PRACT, () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-hw7', prompt: [fromHW(7), 'To prove ', $m(...SQ('‖u + v‖'), ' + ', ...SQ('‖u − v‖'), ' = 2(', ...SQ('‖u‖'), ' + ', ...SQ('‖v‖'), ')'), ', the best first step is'],
    build: choice([['Write each norm squared as a dot product and expand both.'], ['Check it for u = (1, 0) and v = (0, 1).'], ['Use the Cauchy–Schwarz inequality.']], 0,
      'Expand (u + v) · (u + v) and (u − v) · (u − v), then add.',
      [null, 'An example can only show a statement is false; a proof must work for every u and v.', 'Cauchy–Schwarz gives an inequality; this is an equation.']),
  }, {
    id: 'p-hw7b', prompt: ['Problem 7, continued. When you add the two expansions, the ', $m('±2u · v'), ' terms'],
    build: choice([['cancel, leaving 2u · u + 2v · v.'], ['double, giving 4u · v.'], ['become ‖u‖ ‖v‖.']], 0,
      '+2u · v and −2u · v add to 0; then u · u = ‖u‖² and v · v = ‖v‖².',
      [null, 'That happens when you subtract (as in the lesson). Here you add.', 'There is no step that turns u · v into a product of norms.']),
  }, {
    id: 'p-hw8', prompt: [fromHW(8), 'u is orthogonal to v and w. The key step is ', $m('u · (k₁v + k₂w) =')],
    build: choice([[$m('k₁(u · v) + k₂(u · w)')], [$m('(k₁ + k₂)(u · v)')], [$m('k₁k₂(u · v)(u · w)')]], 0,
      'Distribute and pull out the scalars; both dot products are 0 by assumption, so the sum is 0.',
      [null, 'v and w are different vectors; keep u · v and u · w separate.', 'Dot products distribute over sums; they don’t multiply the pieces together.']),
  }, {
    id: 'p-hw10', prompt: [fromHW(10), 'Always true, or sometimes false? (Justify each in your write-up.)'],
    build: grid([
      { parts: ['(a)  u ⊥ v  ⇒  ku ⊥ mv'], ans: ['T'], why: '(ku) · (mv) = km(u · v) = 0.' },
      { parts: ['(b)  u + v = u + w  ⇒  v = w'], ans: ['T'], why: 'Add −u to both sides.' },
      { parts: ['(c)  ‖u + v‖ = ‖u‖ + ‖v‖'], ans: ['F'], why: 'Find one pair where it fails, e.g. two perpendicular unit vectors.' },
      { parts: ['(d)  u · w = v · w  ⇒  u = v'], ans: ['F'], why: 'Find one counterexample; think about which w makes every dot product 0.' },
    ], VTF, { multi: false }),
  }], done, PRACT) }],
  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

// A verdict label in a red outline, faded in at t0.
function chipTxt(p, s, x, y, t0) {
  const g = G(p, { o: 0 }), w = uiW(s, 28) + 40;
  mk('rect', { x: x - w / 2, y: y - 34, width: w, height: 50, rx: 25, fill: 'none', stroke: COL.bad, 'stroke-width': 2.5 }, g);
  T(g, s, { x, y, size: 28, fill: COL.bad, weight: 600, anchor: 'middle' });
  show(g, t0);
}

boot();
</script>
