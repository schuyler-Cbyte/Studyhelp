<script>
'use strict';
// Math 141 Midterm 2 Review, Chapter 1. Practice midterm questions 1 and 2. Storyboard: books/math141-midterm2/chapters/ch01.md.
const CHAPTER = { number: 1, title: 'Parabolas: Vertex Form and Maximum Height', minutes: 7, language: 'en', next: '../ch02/' };

/* ---------- chapter data (checked in ch01.md) ---------- */
const ball = t => -16 * t * t + 64 * t + 5;          // lesson ball: vertex (2, 69), lands at (8 + √69)/4 ≈ 4.0767
const T_LAND = (8 + Math.sqrt(69)) / 4;
const RX = 1180;                                       // centre of the algebra column on the right

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Parabolas', (m) => {
    const p = panel(0);
    introCard(p, m, 'Quadratic Functions · Chapter 1', 'Parabolas', 'vertex form and maximum height', 'Practice midterm questions 1 and 2 · calculator part');
  }],
  ['form', 'Vertex form', (m) => {
    const p = panel(0);
    const P = S.P = plane(p, { cx: 290, cy: 430, u: 52, x0: -2, x1: 6, y0: -4, y1: 6, t0: .1 });
    const L = S.formL = P.layer = G(p);
    ml(L, ['y = a(x − h)', E(2), ' + k'], RX, 210, .3, { size: 66 });
    P.fn(x => -.5 * (x - 2) ** 2 + 5, -2, 6, COL.whole, m('vertex'));
    P.dot(2, 5, COL.task, m('vertex', .9), { label: '(h, k)' });
    tx(L, 'vertex (h, k): the turning point', RX, 320, m('vertex', .5), { size: 32, fill: COL.task, anchor: 'middle', weight: 600 });
    tx(L, 'a < 0: opens downward', RX, 430, m('sign', .3), { size: 34, fill: COL.whole, anchor: 'middle', weight: 600 });
    P.fn(x => .5 * (x - 2) ** 2 - 3, -2, 6, COL.dim, m('sign', 3.2));
    tx(L, 'a > 0: opens upward', RX, 500, m('sign', 3.2), { size: 34, fill: COL.dim, anchor: 'middle', weight: 600 });
  }],
  ['plug', 'From a vertex and a point', (m) => {
    const p = S.panel, P = S.P;
    hide(S.formL, 0, .4);
    const L = P.layer = G(p);
    P.dot(2, 5, COL.task, .4, { label: '(2, 5)' });
    P.dot(4, -3, COL.irr, m('pt'), { label: '(4, −3)' });
    const o = { xEq: 1090, size: 46 };
    eqLine(L, 'y', ['a(x − 2)', E(2), ' + 5'], 185, m('sub1'), o);
    eqLine(L, '−3', ['a(4 − 2)', E(2), ' + 5'], 275, m('sub2'), o);
    eqLine(L, '−3', '4a + 5', 365, m('simp'), o);
    eqLine(L, '−8', '4a', 450, m('solve'), o);
    eqLine(L, 'a', '−2', 525, m('solve', 1.6), { ...o, fill: COL.task });
    const ans = ml(L, ['y = −2(x − 2)', E(2), ' + 5'], RX, 620, m('ans'), { size: 52, fill: COL.good });
    boxMath(L, ans, RX, 620, 52, m('ans', .7));
    P.fn(x => -2 * (x - 2) ** 2 + 5, -1, 5, COL.whole, m('graph'), { dur: 1.4 });
  }],
  ['q1', 'Quick check', () => {}, { ask: done => quiz(BAND, [{
    id: 'c-find-a', prompt: ['A parabola has vertex ', $m('(1, −3)'), ' and passes through ', $m('(3, 5)'), '. Find ', $m('a'), '.'],
    build: blanks([{ parts: ['y = ', { box: '2' }, '(x − 1)', E(2), ' − 3'], why: '5 = a(3 − 1)² − 3, so 4a − 3 = 5, 4a = 8 and a = 2.',
      hint: 'Put x = 3 and y = 5 into y = a(x − 1)² − 3, then solve for a.' }]),
  }], done) }],
  ['vertexf', 'Maximum height', (m) => {
    const p = panel(0);
    const A = S.A = axes(p, { x0: 150, y0: 640, w: 600, h: 480, xs: [0, 5, 1], ys: [0, 80, 20], xl: 'time t (seconds)', yl: 'height (feet)', t0: .1 });
    const col = S.vf = G(p);
    ml(col, ['h(t) = −16t', E(2), ' + 64t + 5'], RX, 170, .3, { size: 50 });
    draw(path(p, curveD(A, ball, 0, T_LAND), { stroke: COL.whole, 'stroke-width': 4.5 }, { d: 0 }), m('curve'), 1.4);
    ml(col, ['vertex:  t = ', F('−b', '2a')], RX, 290, m('formula'), { size: 50, fill: COL.task });
    ml(col, ['t = ', F('−64', '2(−16)'), ' = ', F('−64', '−32')], RX, 410, m('plug'), { size: 50 });
    ml(col, ['t = 2 seconds'], RX, 505, m('t2'), { size: 50, fill: COL.task });
    dashed(p, `M${A.PX(2)} ${A.PY(0)}V${A.PY(69)}`, m('t2'));
    ml(col, ['h(2) = −64 + 128 + 5 = 69 feet'], RX, 590, m('max'), { size: 46, fill: COL.good });
    dashed(p, `M${A.PX(0)} ${A.PY(69)}H${A.PX(2)}`, m('max'));
    const v = G(p, { x: A.PX(2), y: A.PY(69), s: 0, o: 0 });
    mk('circle', { r: 11, fill: COL.good, stroke: COL.board, 'stroke-width': 2 }, v);
    pop(v, m('max', .3));
    tx(p, 'maximum (2, 69)', A.PX(2) + 22, A.PY(69) - 18, m('max', .5), { size: 26, fill: COL.good, weight: 600 });
    const s = G(p, { x: A.PX(0), y: A.PY(5), s: 0, o: 0 });
    mk('circle', { r: 10, fill: COL.irr, stroke: COL.board, 'stroke-width': 2 }, s);
    pop(s, m('start', .4));
    ml(col, ['h(0) = 5 feet  (the kick)'], RX, 670, m('start'), { size: 42, fill: COL.irr });
  }],
  ['land', 'When it lands', (m) => {
    const p = S.panel, A = S.A;
    hide(S.vf, 0, .4);
    const col = G(p);
    ml(col, ['−16t', E(2), ' + 64t + 5 = 0'], RX, 170, .4, { size: 48 });
    fracEq(col, 't =', ['−64 ± ', R('4096 + 320')], ['2(−16)'], 870, 255, m('qf'), { size: 44 });
    fracEq(col, 't =', ['−64 ± ', R('4416')], ['−32'], 870, 375, m('simp'), { size: 44 });
    ml(col, [R('4416'), ' = 8', R('69')], 1250, 393, m('simp', .8), { size: 34, fill: COL.dim, anchor: 'start' });
    const good = fracEq(col, 't =', ['8 + ', R('69')], ['4'], 870, 520, m('two'), { size: 44, fill: COL.good, after: ['≈ 4.08 seconds'] });
    const bad = fracEq(col, 't =', ['8 − ', R('69')], ['4'], 870, 655, m('two', 1.6), { size: 44, after: ['≈ −0.08'] });
    draw(path(col, `M860 ${655 + 40}L${bad.x1 + 10} ${655 - 60}`, { stroke: COL.bad, 'stroke-width': 5 }, { d: 0 }), m('reject'), .5);
    tx(col, 'negative: reject', bad.x1 + 34, 668, m('reject', .3), { size: 30, fill: COL.bad, weight: 600 });
    ansBox(col, 850, 440, good.x1 - 850 + 24, 140, m('ans'));
    const d = G(p, { x: A.PX(T_LAND), y: A.PY(0), s: 0, o: 0 });
    mk('circle', { r: 11, fill: COL.good, stroke: COL.board, 'stroke-width': 2 }, d);
    pop(d, m('ans', .5));
    tx(p, 'lands ≈ 4.08 s', A.PX(T_LAND) + 30, A.PY(0) - 40, m('ans', .7), { size: 26, fill: COL.good, weight: 600 });
  }],
  ['q2', 'Quick check', () => {
    const p = panel(0);
    ml(p, ['t = ', F('−b', '2a'), ' ,   then  h(t)'], 800, 380, .2, { size: 64, fill: COL.task });
  }, { ask: done => quiz(BAND, [{
    id: 'c-tmax', prompt: ['A ball’s height is ', $m('h(t) = −4t', E(2), ' + 24t + 1'), ' feet. When is it highest?'],
    build: blanks([{ parts: ['t = ', { box: '3' }, ' seconds'], why: 't = −b/(2a) = −24/(2(−4)) = −24/(−8) = 3 seconds.',
      hint: 'Use t = −b/(2a) with a = −4 and b = 24.' }]),
  }, {
    id: 'c-hmax', prompt: ['What is the maximum height of that ball?'],
    build: blanks([{ parts: ['h(3) = ', { box: '37' }, ' feet'], why: 'h(3) = −4(9) + 24(3) + 1 = −36 + 72 + 1 = 37 feet.',
      hint: 'Put t = 3 into −4t² + 24t + 1. Square first: 3² = 9.' }]),
  }], done) }],
  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    wrapList(p, m, [['Vertex form y = a(x − h)² + k has vertex (h, k).', 'w1'], ['Substitute one more point to solve for a.', 'w2'],
      ['Standard form: vertex at t = −b/(2a); h of that t is the maximum.', 'w3'], ['Landing: set h(t) = 0 and reject a negative time.', 'w4']]);
  }],
  ['final1', PRACT, () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-q1', prompt: [fromExam(1), 'A parabola opens downward, has vertex ', $m('(−1, 4)'), ' and passes through ', $m('(1, −16)'), '. Complete its vertex form.'],
    build: blanks([{ parts: ['y = ', { box: '-5' }, '(x + 1)', E(2), ' + 4'], why: 'y = a(x + 1)² + 4 and −16 = a(1 + 1)² + 4, so 4a = −20 and a = −5. Negative, so it opens downward, as required.',
      hint: 'h = −1, so x − h = x + 1. Put x = 1 and y = −16 into y = a(x + 1)² + 4.' }]),
  }, {
    id: 'p-q2a', prompt: [fromExam('2a'), 'The ball’s height is ', $m('h(t) = −3t', E(2), ' + 18t + 2'), ' feet. How long until its maximum height?'],
    build: blanks([{ parts: ['t = ', { box: '3' }, ' seconds'], why: 't = −b/(2a) = −18/(2(−3)) = −18/(−6) = 3 seconds.', hint: 'a = −3 and b = 18. Mind both negative signs.' }]),
  }, {
    id: 'p-q2b', prompt: [fromExam('2b'), 'What is the maximum height?'],
    build: blanks([{ parts: ['h(3) = ', { box: '29' }, ' feet'], why: 'h(3) = −3(9) + 18(3) + 2 = −27 + 54 + 2 = 29 feet.', hint: 'Put t = 3 into −3t² + 18t + 2.' }]),
  }, {
    id: 'p-q2c', prompt: [fromExam('2c'), 'What was the height when the ball was kicked?'],
    build: blanks([{ parts: ['h(0) = ', { box: '2' }, ' feet'], why: 'At the kick t = 0, so h(0) = 2 feet, the constant term.', hint: 'The kick happens at t = 0.' }]),
  }, {
    id: 'p-q2d', prompt: [fromExam('2d'), 'When does the ball hit the ground? Exact, then three significant digits.'],
    build: choice([[$m('t = ', F('9 + √87', '3'), ' ≈ 6.11 seconds')], [$m('t = ', F('9 − √87', '3'), ' ≈ −0.109 seconds')], [$m('t = 3 + √87 ≈ 12.3 seconds')]], 0,
      'Set −3t² + 18t + 2 = 0: t = (−18 ± √348)/(−6), and √348 = 2√87, so t = 3 ∓ √87/3. Keep the positive time: (9 + √87)/3 ≈ 6.11 seconds.',
      [null, 'That time is negative, before the kick, so reject it.', 'Divide all of the top by −6: 2√87/6 = √87/3, not √87.']),
  }], done, PRACT) }],
  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
