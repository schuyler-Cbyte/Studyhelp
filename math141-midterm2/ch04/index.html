<script>
'use strict';
// Math 141 Midterm 2 Review, Chapter 4. Practice midterm questions 7, 10, 12. Storyboard: books/math141-midterm2/chapters/ch04.md.
const CHAPTER = { number: 4, title: 'Zero Tests and Graph Shapes', minutes: 7, language: 'en', next: '../ch05/' };

/* ---------- chapter data (checked in ch04.md) ---------- */
const POSR = [['2x', E(5)], [' + 3x', E(4)], [' − x', E(2)], [' + 4x'], [' − 1']], POSS = ['+', '+', '−', '+', '−'];
const NEGR = [['−2x', E(5)], [' + 3x', E(4)], [' − x', E(2)], [' − 4x'], [' − 1']], NEGS = ['−', '+', '−', '−', '−'];
const ODD = [true, false, false, true, false];
// The four practice-midterm graphs (question 7), drawn from the equations: [letter, f, x range, y range].
const EXG = [['A', x => x ** 3 - 8 * x + 1, 3.5, [-16, 18]], ['B', x => -(x ** 5) + 2 * x * x + 1, [-1.6, 1.8], [-12, 17]],
  ['C', x => x ** 5 - 10 * x ** 3 + 9 * x + 1, 3.1, [-45, 45]], ['D', x => x ** 4 + 3 * x * x - x + 1, 2, [-3, 30]]];

// A row of terms with each term's sign under it and an arc under every sign change; returns the row.
function signRow(p, lead, terms, signs, y, m, fills = []) {
  const row = tokens(p, [lead].concat(terms.map((t, i) => ({ t, fill: fills[i] || COL.chalk }))), { x: 800, y, size: 54, anchor: 'middle', o: 0 });
  row.forEach((e, i) => show(e, .3 + i * .08));
  const sx = row.slice(1).map(e => e._px + 8);
  signs.forEach((s, i) => ml(p, [s], sx[i], y + 80, m('signs', .4 + i * .3), { size: 48, fill: s === '+' ? COL.whole : COL.nat }));
  let n = 0;
  signs.forEach((s, i) => {
    if (i && s !== signs[i - 1]) {
      const t0 = m('changes', n * .9);
      arc(p, sx[i - 1] + 18, y + 98, sx[i] - 18, y + 98, 44, COL.task, t0);
      ml(p, [String(++n)], (sx[i - 1] + sx[i]) / 2, y + 150, t0 + .3, { size: 32, fill: COL.task });
    }
  });
  return row;
}
// A small sketch of y = f(u) for u in [−1, 1] (f in [−1, 1]), used for end behavior.
function mini(p, cx, cy, f, color, t0, label) {
  const w = 270, h = 210, g = G(p, { o: 0 });
  path(g, `M${cx - w / 2} ${cy}H${cx + w / 2}M${cx} ${cy - h / 2}V${cy + h / 2}`, { stroke: COL.faint, 'stroke-width': 2 });
  show(g, t0, .3);
  let d = '';
  for (let i = 0; i <= 60; i++) { const u = -1 + 2 * i / 60; d += (i ? 'L' : 'M') + (cx + u * (w / 2 - 12)).toFixed(1) + ' ' + (cy - f(u) * (h / 2 - 8)).toFixed(1); }
  draw(path(p, d, { stroke: color, 'stroke-width': 5 }, { d: 0 }), t0 + .2, .9);
  tx(p, label, cx, cy + h / 2 + 46, t0 + .3, { size: 28, fill: color, anchor: 'middle', weight: 600 });
}
// One practice-midterm graph in a 300 × 210 box (axes where x = 0 and y = 0), clipped to its y range.
function exGraph(p, cx, cy, [letter, f, xr, [ylo, yhi]]) {
  const w = 300, h = 210, [xa, xb] = Array.isArray(xr) ? xr : [-xr, xr];
  const PX = x => cx - w / 2 + (x - xa) / (xb - xa) * w, PY = y => cy + h / 2 - (y - ylo) / (yhi - ylo) * h;
  path(p, `M${cx - w / 2} ${PY(0)}H${cx + w / 2}M${PX(0)} ${cy - h / 2}V${cy + h / 2}`, { stroke: COL.dim, 'stroke-width': 2 });
  let d = '', pen = false;
  for (let i = 0; i <= 160; i++) {
    const x = xa + (xb - xa) * i / 160, y = f(x), inside = y >= ylo && y <= yhi;
    if (inside) { d += `${pen ? 'L' : 'M'}${PX(x).toFixed(1)} ${PY(y).toFixed(1)}`; pen = true; } else pen = false;
  }
  path(p, d, { stroke: COL.whole, 'stroke-width': 4 });
  T(p, 'Graph ' + letter, { x: cx, y: cy - h / 2 - 18, size: 28, fill: COL.chalk, weight: 600, anchor: 'middle' });
}

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Zero tests', (m) => {
    const p = panel(0);
    introCard(p, m, 'Polynomial Functions · Chapter 4', 'Zero Tests and Graph Shapes', 'candidates, sign counts and end behavior', 'Practice midterm questions 7, 10 and 12');
  }],
  ['rzt', 'Rational Zero Test', (m) => {
    const p = panel(0), y = 180, sz = 56;
    const row = tokens(p, ['f(x) = ', { t: '3', fill: COL.whole }, ['x', E(4), ' − 5x', E(2), ' + x − '], { t: '4', fill: COL.nat }], { x: 800, y, size: sz, anchor: 'middle', o: 0 });
    row.forEach(e => show(e, .3));
    const ring = (e, color, t0) => { const c = put(mk('circle', { cx: e._px, cy: y - sz * .33, r: sz * .46, fill: 'none', stroke: color, 'stroke-width': 3.5 }, p), { o: 0 }); show(c, t0, .3); };
    ring(row[3], COL.nat, m('const'));
    ml(p, ['p :   1,  2,  4'], 480, 320, m('const', 1), { size: 46, fill: COL.nat });
    tx(p, 'factors of the constant', 480, 368, m('const', 1.3), { size: 26, fill: COL.dim, anchor: 'middle' });
    ring(row[1], COL.whole, m('lead'));
    ml(p, ['q :   1,  3'], 1120, 320, m('lead', 1), { size: 46, fill: COL.whole });
    tx(p, 'factors of the leading coefficient', 1120, 368, m('lead', 1.3), { size: 26, fill: COL.dim, anchor: 'middle' });
    ml(p, ['possible rational zeros  =  ±', F('p', 'q')], 800, 470, m('list'), { size: 48, fill: COL.task });
    ml(p, ['±', F(1, 1), ',  ±', F(2, 1), ',  ±', F(4, 1), '    →    ±1,  ±2,  ±4'], 800, 580, m('q1'), { size: 46 });
    ml(p, ['±', F(1, 3), ',  ±', F(2, 3), ',  ±', F(4, 3)], 800, 690, m('q3'), { size: 46 });
    tx(p, 'candidates only: test them to find the actual zeros', 800, 780, m('note'), { size: 28, fill: COL.dim, anchor: 'middle' });
  }],
  ['q1', 'Quick check', () => {
    const p = panel(0);
    ml(p, ['possible rational zeros  =  ±', F('factors of the constant', 'factors of the leading coefficient')], 800, 380, .2, { size: 46, fill: COL.task });
  }, { ask: done => quiz({ ...LOW, y: 560, maxH: 330 }, [{
    id: 'c-rzt', prompt: ['List the possible rational zeros of ', $m('f(x) = 5x', E(3), ' + x − 3'), '.'],
    build: choice([[$m('±1, ±3, ±', F(1, 5), ', ±', F(3, 5))], [$m('±1, ±5, ±', F(1, 3), ', ±', F(5, 3))], [$m('±1, ±3, ±5, ±15')]], 0,
      'p: factors of 3 are 1, 3. q: factors of 5 are 1, 5. So ±1, ±3, ±1/5, ±3/5.',
      [null, 'Upside down: the constant’s factors go on top, the leading coefficient’s on the bottom.', 'Divide p by q; don’t multiply. The candidates are ±p/q.']),
  }], done) }],
  ['desc', 'Positive zeros', (m) => {
    const p = panel(0);
    signRow(p, 'f(x) = ', POSR, POSS, 200, m);
    ml(p, ['positive real zeros:   3  or  1'], 800, 430, m('ans'), { size: 46, fill: COL.good });
    tx(p, 'the number of changes, or less by an even number', 800, 476, m('rule'), { size: 26, fill: COL.dim, anchor: 'middle' });
  }],
  ['neg', 'Negative zeros', (m) => {
    const p = S.panel;
    signRow(p, 'f(−x) = ', NEGR, NEGS, 570, m, ODD.map(o => o ? COL.nat : null));
    tx(p, 'odd powers change sign', 1290, 500, m('odd'), { size: 28, fill: COL.nat, anchor: 'middle', weight: 600 });
    ml(p, ['negative real zeros:   2  or  0'], 800, 800, m('ans'), { size: 46, fill: COL.good });
  }, { lead: false }],
  ['q2', 'Quick check', () => {
    const p = panel(0);
    ml(p, ['sign changes in  f(x)  →  positive zeros'], 800, 330, .2, { size: 44, fill: COL.task });
    ml(p, ['sign changes in  f(−x)  →  negative zeros'], 800, 420, .4, { size: 44, fill: COL.task });
  }, { ask: done => quiz(BAND, [{
    id: 'c-desc', prompt: ['How many positive real zeros can ', $m('g(x) = x', E(5), ' − 2x', E(3), ' + x', E(2), ' − 7'), ' have?'],
    build: choice([['3 or 1'], ['exactly 3'], ['2 or 0']], 0, 'Signs + − + −: three changes, so 3 or 1 (less by an even number).',
      [null, 'Descartes’s Rule gives the number of changes or less by an even number: 3 or 1.', 'Count again: + to −, − to +, + to −. That is three changes.']),
  }], done) }],
  ['ends', 'End behavior', (m) => {
    const p = panel(0);
    ml(p, ['the leading term  ax', E('n'), '  decides the ends'], 800, 140, m('lead'), { size: 44, fill: COL.task });
    mini(p, 250, 360, u => u * u, COL.whole, m('even'), 'even, a > 0');
    mini(p, 610, 360, u => -u * u, COL.nat, m('even', 2.8), 'even, a < 0');
    mini(p, 990, 360, u => u ** 3, COL.whole, m('odd'), 'odd, a > 0');
    mini(p, 1350, 360, u => -(u ** 3), COL.nat, m('odd', 4.4), 'odd, a < 0');
    ml(p, ['degree  n   →   at most  n − 1  turning points'], 800, 630, m('turn'), { size: 42 });
  }],
  ['q3', 'Quick check', () => {}, { ask: done => quiz({ ...LOW, y: 670, maxH: 220 }, [{
    id: 'c-ends', prompt: ['Which describes the ends of ', $m('y = −2x', E(3), ' + 5x'), '?'],
    build: choice([['up on the left, down on the right'], ['down on the left, up on the right'], ['down on both sides']], 0,
      'Odd degree with a negative leading coefficient: up on the left, down on the right.',
      [null, 'That is odd degree with a positive leading coefficient; here it is −2.', 'Both ends match only for even degree; 3 is odd.']),
  }], done) }],
  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    wrapList(p, m, [['Possible rational zeros: ± factors of constant / factors of leading coefficient.', 'w1'], ['Sign changes in f(x): positive zeros, or fewer by 2s.', 'w2'],
      ['Sign changes in f(−x): negative zeros, or fewer by 2s.', 'w3'], ['Leading term sets the ends; at most n − 1 turning points.', 'w4']]);
  }],
  ['final1', PRACT, () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-q10', prompt: [fromExam(10), 'List the possible rational zeros of ', $m('f(x) = 7x', E(5), ' + 12x', E(3), ' − 4x', E(2), ' + 2'), '.'],
    build: choice([[$m('±1, ±2, ±', F(1, 7), ', ±', F(2, 7))], [$m('±1, ±7, ±', F(1, 2), ', ±', F(7, 2))], [$m('±1, ±2, ±7, ±14')]], 0,
      'p: factors of 2 are 1, 2. q: factors of 7 are 1, 7. So ±1, ±2, ±1/7, ±2/7.',
      [null, 'Upside down: factors of the constant 2 go on top, factors of 7 on the bottom.', 'Divide p by q: ±p/q, not products.']),
  }, {
    id: 'p-q12a', prompt: [fromExam('12a'), $m('f(x) = 7x', E(5), ' − 3x', E(4), ' − 2x + 5'), '. Possible numbers of positive real zeros?'],
    build: choice([['2 or 0'], ['2 only'], ['3 or 1']], 0, 'Signs + − − +: two changes, so 2 or 0.',
      [null, 'It can also be 2 − 2 = 0.', 'Count again: + to − is one, − to − is none, − to + is two.']),
  }, {
    id: 'p-q12b', prompt: ['Question 12b. ', $m('f(−x) = −7x', E(5), ' − 3x', E(4), ' + 2x + 5'), '. Possible numbers of negative real zeros?'],
    build: choice([['1'], ['1 or 0'], ['3 or 1']], 0, 'Odd powers flip: signs − − + +, one change, so exactly 1 (1 − 2 would be negative).',
      [null, 'Subtract 2s only while the count stays at 0 or more: 1 − 2 is negative, so it is exactly 1.', 'Only −7x⁵ and −2x flip sign: − − + + has one change.']),
  }], done, PRACT) }],
  ['final2', PRACT, () => {
    const p = panel(0);
    EXG.forEach((g, i) => exGraph(p, 230 + i * 380, 190, g));
  }, { ask: done => quiz({ x: 160, y: 350, w: 1280, cls: 'side', maxH: 540 }, [{
    id: 'p-q7', prompt: [fromExam(7), 'Match each equation with its graph.'],
    build: grid([
      { parts: ['y = x', E(4), ' + 3x', E(2), ' − x + 1'], ans: ['D'], why: 'Even degree, positive leading coefficient: both ends up. Graph D.' },
      { parts: ['y = −x', E(5), ' + 2x', E(2), ' + 1'], ans: ['B'], why: 'Odd degree, negative leading coefficient: up on the left, down on the right. Graph B.' },
      { parts: ['y = x', E(5), ' − 10x', E(3), ' + 9x + 1'], ans: ['C'], why: 'Odd and positive: down left, up right. Degree 5 allows 4 turning points; Graph C has 4.' },
      { parts: ['y = x', E(3), ' − 8x + 1'], ans: ['A'], why: 'Odd and positive, degree 3: at most 2 turning points. Graph A.' },
    ], ['A', 'B', 'C', 'D'].map(k => [k, 'Graph ' + k, null, k.toLowerCase()]), { multi: false }),
  }], done, PRACT) }],
  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
