<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Bookshelf</title>
<style>
:root {
  --board: #1d2b27; --board2: #23332e; --edge: #3a4d46;
  --chalk: #ece8dc; --dim: #9aaba3; --faint: #5d7068;
  --draft: #9aaba3; --pilot: #f0b45a; --ready: #8fd6b0;
  --ui: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --book: "STIX Two Text", "Iowan Old Style", Palatino, Georgia, serif;
}
* { box-sizing: border-box; }
html { color-scheme: dark; }
body { margin: 0; min-height: 100svh; background: var(--board); color: var(--chalk); font: 17px/1.5 var(--ui); }
main { max-width: 1120px; margin: 0 auto; padding: 56px 24px 72px; }
.kicker { margin: 0 0 6px; font-size: 13px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
h1 { margin: 0 0 10px; font: 400 clamp(34px, 6vw, 56px)/1.1 var(--book); }
.lede { margin: 0 0 36px; max-width: 38em; color: var(--dim); }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 0; margin: 0; list-style: none; }
.card { display: flex; flex-direction: column; gap: 10px; height: 100%; padding: 22px 22px 18px; border: 1.5px solid var(--edge); border-radius: 14px;
  background: var(--board2); color: inherit; text-decoration: none; transition: border-color .15s, transform .15s; }
.card:hover, .card:focus-visible { border-color: var(--chalk); transform: translateY(-2px); outline: none; }
.spine { height: 6px; border-radius: 3px; background: var(--c, var(--dim)); }
.card h2 { margin: 4px 0 0; font: 400 26px/1.2 var(--book); }
.card p { margin: 0; color: var(--dim); font-size: 15px; }
.card .foot { margin-top: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-top: 8px; font-size: 14px; color: var(--dim); }
.badge { display: inline-block; padding: 2px 10px; border-radius: 99px; border: 1.5px solid var(--s); color: var(--s); font-size: 13px; font-weight: 600; letter-spacing: .02em; }
.empty, .error { padding: 40px 24px; border: 1.5px dashed var(--edge); border-radius: 14px; color: var(--dim); text-align: center; }
.error { border-color: #f08c7a; color: #f6c2b8; text-align: left; }
.error code, .empty code { color: var(--chalk); }
footer { margin-top: 48px; font-size: 14px; color: var(--faint); }
@media (max-width: 480px) { main { padding: 36px 16px 56px; } }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }
</style>
</head>
<body>
<main>
  <p class="kicker">Papermorph · this PC only</p>
  <h1>Local bookshelf</h1>
  <p class="lede">Interactive books made for this project. Each book lives in its own folder under <code>site/</code>. Status shows how far along review is.</p>
  <ul class="shelf" id="shelf" aria-live="polite"></ul>
  <div class="empty" id="empty" hidden>No books on the shelf yet. A book is added here once its local preview works.</div>
  <div class="error" id="error" hidden></div>
  <footer>Catalog: <code>bookshelf.json</code>.</footer>
</main>
<script>
'use strict';
// The shelf is built from bookshelf.json. Links are relative ("<slug>/") so the site works from any folder,
// e.g. a GitHub Pages project URL; an older "/<slug>/" entry is accepted and made relative. Each entry:
//   { "slug": "lowercase-slug", "title": "...", "subtitle": "...", "status": "Draft" | "Pilot / in review" | "Ready",
//     "href": "<slug>/", "chapters": { "available": 1, "planned": 8 }, "note": "...", "updated": "YYYY-MM-DD", "hue": "#rrggbb" }
const STATUS = { 'Draft': 'var(--draft)', 'Pilot / in review': 'var(--pilot)', 'Ready': 'var(--ready)' };
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const valid = b => b && typeof b === 'object'
  && typeof b.slug === 'string' && /^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(b.slug)
  && typeof b.title === 'string' && b.title.trim()
  && Object.hasOwn(STATUS, b.status)
  && typeof b.href === 'string' && /^\/?[a-z0-9]+(?:-[a-z0-9]+)*\/$/.test(b.href);

function card(b) {
  const a = el('a', 'card');
  a.href = b.href.replace(/^\//, '');
  a.setAttribute('aria-label', `${b.title} (${b.status})`);
  const spine = el('div', 'spine');
  if (typeof b.hue === 'string' && /^#[0-9a-f]{6}$/i.test(b.hue)) spine.style.setProperty('--c', b.hue);
  a.append(spine, el('h2', '', b.title));
  if (typeof b.subtitle === 'string') a.append(el('p', '', b.subtitle));
  if (typeof b.note === 'string') a.append(el('p', '', b.note));
  const foot = el('div', 'foot');
  const badge = el('span', 'badge', b.status);
  badge.style.setProperty('--s', STATUS[b.status]);
  foot.append(badge);
  const c = b.chapters;
  if (c && Number.isInteger(c.available)) foot.append(el('span', '', Number.isInteger(c.planned)
    ? `${c.available} of ${c.planned} chapters built` : `${c.available} chapter${c.available === 1 ? '' : 's'}`));
  if (typeof b.updated === 'string') foot.append(el('span', '', `Updated ${b.updated}`));
  a.append(foot);
  const li = el('li');
  li.append(a);
  return li;
}

fetch('bookshelf.json', { cache: 'no-store' })
  .then(r => { if (!r.ok) throw new Error(`bookshelf.json: HTTP ${r.status}`); return r.json(); })
  .then(data => {
    const books = Array.isArray(data?.books) ? data.books : [];
    const good = books.filter(valid);
    $('shelf').replaceChildren(...good.map(card));
    $('empty').hidden = good.length > 0;
    const skipped = books.length - good.length;
    if (skipped) { $('error').hidden = false; $('error').textContent = `${skipped} catalog entr${skipped === 1 ? 'y was' : 'ies were'} skipped because a field is missing or invalid.`; }
  })
  .catch(err => {
    $('error').hidden = false;
    $('error').replaceChildren('The catalog could not be loaded (', String(err.message || err), '). Serve the site folder over HTTP, for example: ',
      el('code', '', 'python -m http.server 8765 --bind 127.0.0.1 --directory site'));
  });
</script>
</body>
</html>
